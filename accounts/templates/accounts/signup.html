{% extends 'base.html' %}
{% block content %}
<div class="auth-page">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-7 col-lg-6">
        <div class="card auth-card">
          <div class="card-body">
            <h2>Create Account</h2>
            <p class="auth-subtitle">Join HiveHire and start your journey today.</p>
            <hr>
            <form method="POST">
              {% csrf_token %}
              {{ template_data.form.as_p }}
              <button type="submit" class="btn btn-primary mt-2">Create Account</button>
            </form>
            <p class="text-center text-muted mt-3 mb-0" style="font-size:0.875rem;">
              Already have an account? <a href="{% url 'accounts.login' %}" style="color:var(--navy);font-weight:600;">Sign In</a>
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock content %}
