{% extends 'base.html' %}
{% block content %}
<div class="auth-page">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="card auth-card">
          <div class="card-body">
            <h2>Login</h2>
            <p class="auth-subtitle">Welcome back — let's pick up where you left off.</p>
            <hr>
            {% if template_data.error %}
            <div class="alert alert-danger" role="alert">
              <i class="fas fa-exclamation-circle me-2"></i>{{ template_data.error }}
            </div>
            {% endif %}
            <form method="POST">
              {% csrf_token %}
              <div class="mb-3">
                <label class="form-label" for="username">Username</label>
                <input id="username" type="text" name="username" required
                       autocomplete="username" class="form-control"
                       placeholder="Enter your username">
              </div>
              <div class="mb-4">
                <label class="form-label" for="password">Password</label>
                <input id="password" type="password" name="password" required
                       autocomplete="current-password" class="form-control"
                       placeholder="Enter your password">
              </div>
              <button type="submit" class="btn btn-primary">Login</button>
            </form>
            <p class="text-center text-muted mt-3 mb-0" style="font-size:0.875rem;">
              Don't have an account? <a href="{% url 'accounts.signup' %}" style="color:var(--navy);font-weight:600;">Sign Up</a>
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock content %}
